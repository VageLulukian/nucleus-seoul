<!DOCTYPE html>
<html lang="ru" data-state="LOADING">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <!-- Repo-локальный маркер сборки: smoke.sh подтверждает НАШ сервер/страницу. -->

  <!-- PWA standalone (S-D14, IMPLEMENT.md): «добавить на главный экран» → полный
       bleed без хрома браузера; тёмный theme-color; iPhone Safari + Pixel Chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>NUCLEUS</title>

  <!-- Хук ошибок (идентичен index.html): инлайн ДО модулей; capture-фаза ловит
       404 ресурсов, обёртка console.error — рантайм. Счётчик уходит в self-test. -->
  <script>
    (function installErrorHooks() {
      window.__errCount = 0;
      window.__errLog = [];
      function record(kind, detail) {
        window.__errCount += 1;
        if (window.__errLog.length < 50) window.__errLog.push(kind + ': ' + detail);
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
          record('resource', String(e.target.src || e.target.href));
        } else {
          record('error', (e && e.message) || 'unknown');
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        record('unhandledrejection', (reason && (reason.stack || reason.message)) || String(reason));
      });
      var nativeConsoleError = console.error.bind(console);
      console.error = function () {
        record('console.error', Array.prototype.join.call(arguments, ' '));
        nativeConsoleError.apply(console, arguments);
      };
    })();
  </script>

  <style>
    /* === Дизайн-токены — ПАРИТЕТ с index.html :root (тот же продукт, ролик №1).
       Реальный циан #58DDE3 (НЕ устаревший #2BF5E0 из screen.md §2 — IMPLEMENT.md /
       plan-review Codex: реальный index.html побеждает). Красный --alert только как
       «необратимость» (строка ROLLBACK + затвор финала), не паника. === */
    :root {
      --bg-900: #05070A; --bg-800: #0A0E14; --bg-700: #111722; --bg-600: #18202E;
      --text-hi: #E8EEF5; --text-mid: #AEB9C6; --text-low: #7B8796;
      --accent: #58DDE3; --accent-deep: #1AA9B5; --accent-glow: rgba(88, 221, 227, 0.28);
      --ok: #38E8B0; --ok-glow: rgba(56, 232, 176, 0.30);
      --line-ok-hi: rgba(56, 232, 176, 0.55); --line-ok: rgba(56, 232, 176, 0.30);
      --scene-accent: #58DDE3; /* seoul/visuals.js держит cyan во всех состояниях */
      --alert: #FF2D43; --alert-deep: #8E0014; --alert-glow: rgba(255, 45, 67, 0.40);
      --warn: #FFB020; --warn-glow: rgba(255, 176, 32, 0.45);
      --font-head: "Martian Grotesk Condensed", "Martian Grotesk", system-ui, sans-serif;
      --font-display: "Martian Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --dur-scene: 600ms;
      --line-cyan-hi: rgba(88, 221, 227, 0.45);
      --line-cyan: rgba(88, 221, 227, 0.26);
      --line-cyan-lo: rgba(88, 221, 227, 0.14);
      --line-dim: rgba(155, 168, 184, 0.15);
      --line-red-hi: rgba(255, 45, 67, 0.50);
      --line-red: rgba(255, 45, 67, 0.26);
      /* Вертикальная сетка зон (screen.md §3, 9:16). */
      --pad-x: clamp(20px, 6vw, 64px);
    }

    /* Самохост шрифтов — ПАРИТЕТ с index.html (Codex: копировать @font-face). */
    @font-face {
      font-family: "Martian Grotesk Condensed"; font-style: normal; font-weight: 900; font-display: swap;
      src: url("./assets/fonts/martian-grotesk-condensed-black.woff2") format("woff2");
    }
    @font-face {
      font-family: "Martian Grotesk"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("./assets/fonts/martian-grotesk-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Martian Grotesk"; font-style: normal; font-weight: 500; font-display: swap;
      src: url("./assets/fonts/martian-grotesk-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("./assets/fonts/ibm-plex-mono-latin-400.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("./assets/fonts/ibm-plex-mono-cyrillic-400.woff2") format("woff2");
      unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap;
      src: url("./assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap;
      src: url("./assets/fonts/ibm-plex-mono-cyrillic-500.woff2") format("woff2");
      unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap;
      src: url("./assets/fonts/ibm-plex-mono-latin-600.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap;
      src: url("./assets/fonts/ibm-plex-mono-cyrillic-600.woff2") format("woff2");
      unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-900); color: var(--text-hi);
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility; overflow: hidden;
    }
    html.cursor-hidden, html.cursor-hidden * { cursor: none !important; }

    /* === Слои (вертикаль 9:16). === */
    #stage {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(120% 70% at 50% 38%, var(--bg-800) 0%, var(--bg-900) 72%);
    }
    #viz { position: fixed; inset: 0; z-index: 1; display: block; width: 100%; height: 100%; pointer-events: none; }

    /* Layer-0 фон-видео Higgsfield (фидбэк оператора 2026-06-24): два ping-pong
       <video> ПОД #viz (z0). src/visuals/background.js грузит fetch→blob по состоянию
       (404-safe) и кроссфейдит opacity. object-fit:cover, без указателя, старт
       opacity:0 (не перекрывают первый canvas-кадр). #viz (z1) рисует cyan-слои
       поверх; в видео-режиме background.render ПРОПУСКАЕТ заливку фона → видео видно
       сквозь прозрачный canvas. Зеркало index.html. */
    #video-layer-0a, #video-layer-0b {
      position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%;
      object-fit: cover; pointer-events: none; opacity: 0;
      transition: opacity var(--dur-scene, 600ms) cubic-bezier(0.16, 1, 0.30, 1);
    }
    /* Видео показано (data-video=on ставит background.js на первом canplaythrough) →
       снять непрозрачную #stage-вигнетку, иначе ко-планарный #stage перекрыл бы видео.
       Нет видео → вигнетка возвращается (фоллбэк байт-идентичен прежнему). */
    html[data-video="on"] #stage { background: none; }

    /* Контейнер сцен. pointer-events:none на контейнере (как образцы), но
       интерактивным .seoul-* ниже возвращаем auto (plan-review Codex #3). */
    #scene { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    .seoul-scene {
      position: absolute; inset: 0;
      animation: scene-in var(--dur-scene, 600ms) cubic-bezier(0.16, 1, 0.30, 1) both;
      will-change: transform, opacity;
    }
    @keyframes scene-in {
      from { opacity: 0; transform: translate3d(0, 10px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* === HUD-кромка (постоянная). === */
    #seoul-hud { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
    .seoul-hud { position: absolute; font-family: var(--font-mono); letter-spacing: 0.14em; color: var(--text-low); text-transform: uppercase; }
    .seoul-hud--top {
      top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: clamp(14px, 2.2vh, 22px) var(--pad-x); font-size: clamp(10px, 2.6vw, 13px);
      /* Сдвиг под safe-area сверху: HUD садится НИЖЕ системного статус-бара/Dynamic
         Island, под баром остаётся только чёрный фон → кроп верхней полоски при
         монтаже записи экрана iPhone не задевает wordmark/сессию. */
      padding-top: calc(clamp(14px, 2.2vh, 22px) + env(safe-area-inset-top, 0px));
    }
    .seoul-hud--top::after {
      content: ""; position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 0; height: 1px;
      background: var(--scene-accent, var(--accent)); opacity: 0.14;
    }
    .seoul-hud__wordmark { color: var(--text-mid); font-weight: 600; letter-spacing: 0.2em; }
    .seoul-hud__session { text-align: right; color: var(--text-low); }
    .seoul-hud--bottom {
      left: 0; right: 0; bottom: 0; text-align: center; font-size: clamp(8px, 2.2vw, 11px);
      padding: clamp(12px, 1.8vh, 18px) var(--pad-x); color: var(--text-low); opacity: 0.8;
      /* Та же логика снизу: футер выше home-indicator (нижняя «чёрточка» iPhone). */
      padding-bottom: calc(clamp(12px, 1.8vh, 18px) + env(safe-area-inset-bottom, 0px));
    }

    /* === Общие зоны (screen.md §3). === */
    .seoul-context {
      position: absolute; top: 8.5%; left: var(--pad-x); right: var(--pad-x); text-align: center;
      font-family: var(--font-mono); font-size: clamp(12px, 3.4vw, 18px); letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent);
    }
    /* Глосс под RUN-тэгом (фидбэк оператора 2026-06-24): рус. человеческая подсказка
       зрителю, что такое «прогон». Абсолютно позиционирован под .seoul-context (top
       8.5%), над геро-зоной (top 13%); мелкий, низкий контраст, НЕ uppercase — не спорит
       с холодным RUN и героем SEOUL/CONFIRMED. */
    .seoul-runhint {
      position: absolute; top: 11.8%; left: var(--pad-x); right: var(--pad-x); text-align: center;
      font-family: var(--font-mono); font-size: clamp(9px, 2.4vw, 12px); letter-spacing: 0.04em;
      text-transform: none; color: var(--text-low); margin: 0; opacity: 0.66;
    }
    .seoul-zone-hero {
      position: absolute; left: var(--pad-x); right: var(--pad-x); top: 13%; height: 47%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3vh, 28px); text-align: center;
    }
    .seoul-zone-readout {
      position: absolute; left: var(--pad-x); right: var(--pad-x); top: 60%; bottom: 14%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: clamp(10px, 2vh, 18px); text-align: center;
    }
    .seoul-zone-manifest {
      position: absolute; left: var(--pad-x); right: var(--pad-x); top: 34%;
      display: flex; flex-direction: column; gap: clamp(12px, 2.4vh, 22px); text-align: left;
    }
    .seoul-zone-cta {
      /* bottom 6.5%→11% — поднимаем CTA, чтобы не сливалась с футером
         «© NUCLEUS · CONFIDENTIAL» (фидбэк оператора 2026-06-24). */
      position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 11%;
      display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.4vh, 14px);
    }
    /* === Чистый режим — типографика. === */
    .seoul-eyebrow {
      display: inline-flex; align-items: center; gap: 12px; margin: 0;
      font-family: var(--font-mono); font-size: clamp(10px, 2.6vw, 13px);
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
    }
    .seoul-eyebrow::before {
      content: ""; width: 9px; height: 9px; border: 1px solid var(--accent); transform: rotate(45deg);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .seoul-h1 {
      font-family: var(--font-head); font-weight: 900; font-size: clamp(30px, 8.6vw, 64px);
      line-height: 1.04; letter-spacing: -0.01em; color: #F1F6FA; margin: 0; max-width: 15ch;
    }
    .seoul-sub {
      font-size: clamp(14px, 4vw, 20px); font-weight: 400; line-height: 1.5; color: #B7C2CE; margin: 0; max-width: 30ch;
    }
    /* SEOUL — доминанта во всю ширину (кадр 4). */
    .seoul-word {
      font-family: var(--font-head); font-weight: 900;
      /* 21vw (было 26vw) + max-width — «SEOUL» влезает целиком на узком телефоне и не
         обрезается до «SEO» (фидбэк оператора 2026-06-24). Чуть ярче glow — «пробивает»,
         оставаясь в каноне (белый+циан, без нового цвета/мотива, S-D13). */
      font-size: clamp(56px, 21vw, 240px); max-width: 100%;
      line-height: 0.9; letter-spacing: 0.02em; color: #F4FAFE; margin: 0;
      text-shadow: 0 0 48px var(--accent-glow), 0 0 12px rgba(88, 221, 227, 0.35);
    }
    .seoul-field {
      font-family: var(--font-mono); font-size: clamp(14px, 4vw, 20px); font-weight: 500;
      letter-spacing: 0.12em; color: var(--accent); margin: 0;
    }
    .seoul-rationale {
      font-family: var(--font-mono); font-size: clamp(11px, 3vw, 14px); letter-spacing: 0.06em;
      color: var(--text-low); margin: 0; opacity: 0.7;
    }
    .seoul-rationale__k { text-transform: lowercase; }

    /* Сверка прогонов + штамп CONFIRMED (кадр 7). */
    .seoul-compare {
      font-family: var(--font-mono); font-size: clamp(13px, 3.6vw, 18px); color: var(--text-mid);
      letter-spacing: 0.06em; border: 1px solid var(--line-cyan); border-radius: 2px;
      padding: clamp(12px, 2.4vh, 18px) clamp(16px, 5vw, 30px);
      background: linear-gradient(180deg, rgba(8,11,16,0.72), rgba(8,11,16,0.82)); text-align: left;
    }
    .seoul-compare__row { margin: clamp(2px, 0.6vh, 6px) 0; white-space: pre; }
    .seoul-compare__match { color: var(--text-hi); }
    .seoul-compare__k { color: var(--text-low); }
    .seoul-stamp {
      position: relative; font-family: var(--font-mono); font-weight: 600;
      font-size: clamp(18px, 5vw, 30px); letter-spacing: 0.3em; color: var(--ok);
      border: 1px solid var(--line-ok-hi); padding: clamp(8px, 1.6vh, 12px) clamp(18px, 5vw, 30px);
      text-shadow: 0 0 18px var(--ok-glow);
    }
    /* Штамп «CONFIRMED» — ЗЕЛЁНЫЙ (решение оператора 2026-06-24, brief C2-D9): «деплой
       успешен». Осознанное исключение из цианового канона кадра 7 (screen.md §5).
       Грамматика «ПОДТВЕРЖДЕНО» ролика №1: двойная hairline-рамка, статично (без
       поворота/строба) — зелёный «холодный», закон §1/§2 «эскалация холодом» не нарушен. */
    .seoul-stamp::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line-ok); pointer-events: none; }

    /* Манифест (кадр 10) — сухие моно-строки. */
    .seoul-mrow {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: clamp(10px, 3vw, 22px);
      font-family: var(--font-mono); font-size: clamp(14px, 4vw, 20px); letter-spacing: 0.06em; margin: 0;
    }
    .seoul-mrow__k { color: var(--text-low); text-transform: uppercase; letter-spacing: 0.14em; }
    .seoul-mrow__cell { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .seoul-mrow__v { color: var(--text-hi); font-weight: 500; text-align: right; }
    /* ПЕРВОЕ появление красного: строка ROLLBACK (LED + слова), статично, без паники. */
    .seoul-mrow--alert .seoul-mrow__v { color: var(--alert); }
    .seoul-mrow__led {
      width: 9px; height: 9px; border-radius: 50%; background: var(--alert); flex: 0 0 auto;
      box-shadow: 0 0 8px var(--alert-glow);
    }

    /* === LOCKED — экран «залочено» (фидбэк оператора 2026-06-24): холодная печать
       решения. Та же манифест-сетка, что VERDICT_3, но циан/холод, БЕЗ красного.
       Карточка-печать с двойной cyan-рамкой (грамматика CONFIRMED, но в cyan) +
       заголовок-LOCK + человеческая строка. === */
    .seoul-scene--locked .seoul-zone-manifest { top: 30%; gap: clamp(8px, 1.8vh, 14px); }
    /* НЕ ставим position:relative — .seoul-zone-manifest уже position:absolute (left/right
       pad-x); relative бы сбросил его в полноширинный блок и значения уехали бы за экран.
       Абсолютный зона-бокс сам служит containing-block для ::after. */
    .seoul-lockcard {
      padding: clamp(16px, 3.4vh, 26px) clamp(18px, 5vw, 30px);
      border: 1px solid var(--line-cyan-hi);
      background: linear-gradient(180deg, rgba(8,11,16,0.72), rgba(8,11,16,0.82));
    }
    .seoul-lockcard::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line-cyan); pointer-events: none; }
    .seoul-locktag {
      font-family: var(--font-mono); font-size: clamp(13px, 3.6vw, 18px); letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--accent); text-shadow: 0 0 14px var(--accent-glow);
      margin: 0 0 clamp(8px, 1.6vh, 14px) 0;
    }
    .seoul-lockline {
      font-family: var(--font-head); font-weight: 900; font-size: clamp(18px, 5vw, 32px);
      line-height: 1.14; color: var(--text-hi); margin: clamp(14px, 2.6vh, 22px) 0 0 0; max-width: 22ch;
    }

    /* Финал (кадр 13) — холодный журнал прибытия по-русски поверх «дорогого» неон-Сеула
       (фидбэк оператора 2026-06-24, override C2-D11 «без видео/canvas»). Премиум-вёрстка:
       скрим под текст (читаемость поверх неона), журнал стопкой в нижней «тёмной» трети
       кадра (над улицей — естественное пустое место картинки), СЕУЛ крупно как панчлайн.
       Всё скоупано на --final: VERDICT_3/LOCKED (общая .seoul-mrow) не трогаем. */
    /* Скрим: верх (скайлайн) чист и светится, текстовая полоса снизу затемнена — текст
       читается, город виден. Под текстом (z в стопке сцены), над видео (z0), под HUD (z6). */
    .seoul-scene--final::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg,
        rgba(5,7,10,0) 0%, rgba(5,7,10,0) 30%,
        rgba(5,7,10,0.42) 50%, rgba(5,7,10,0.80) 78%, rgba(5,7,10,0.94) 100%);
    }
    .seoul-scene--final .seoul-zone-manifest {
      top: auto; bottom: 13%; gap: clamp(16px, 3vh, 30px); text-align: left;
    }
    /* Журнал стопкой — робастно к длинному русскому. Лейбл сверху бледно, значение снизу. */
    .seoul-scene--final .seoul-mrow { display: block; }
    .seoul-scene--final .seoul-mrow__k {
      display: block; font-size: clamp(10px, 2.8vw, 13px); letter-spacing: 0.24em;
      color: var(--text-mid); margin: 0 0 clamp(5px, 1vh, 9px) 0;
    }
    .seoul-scene--final .seoul-mrow__cell { display: block; justify-content: flex-start; text-align: left; }
    /* СЕУЛ — панчлайн города: крупно, ярко, с фирменным циан-glow (как .seoul-word, мельче). */
    .seoul-scene--final .seoul-mrow--final-hero .seoul-mrow__v {
      font-family: var(--font-head); font-weight: 900; text-align: left;
      font-size: clamp(46px, 14vw, 104px); line-height: 0.92; letter-spacing: 0.01em;
      color: #F4FAFE; text-shadow: 0 0 42px var(--accent-glow), 0 0 14px rgba(88, 221, 227, 0.4);
    }
    /* Холодный добивающий итог — суше и мельче, моно, приглушён (казёнщина цела). */
    .seoul-scene--final .seoul-mrow--final-kicker .seoul-mrow__v {
      font-family: var(--font-mono); font-weight: 500; text-align: left;
      font-size: clamp(18px, 5vw, 28px); line-height: 1.12; letter-spacing: 0.04em;
      color: var(--text-hi);
    }
    /* «ЛОКАЦИЯ СОВПАДАЕТ С ПРОГНОЗОМ» — циан-акцент с ромб-тиком (система была права). */
    .seoul-finalmatch {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-mono); font-size: clamp(12px, 3.4vw, 16px); letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent); margin: 0;
      text-shadow: 0 0 16px var(--accent-glow);
    }
    .seoul-finalmatch::before {
      content: ""; flex: 0 0 auto; width: 8px; height: 8px; border: 1px solid var(--accent);
      transform: rotate(45deg); box-shadow: 0 0 10px var(--accent-glow);
    }

    /* === Технический режим (кадры 3/6/9): левый «консольный» каркас. === */
    .seoul-scene--tech .seoul-zone-readout { text-align: left; align-items: stretch; top: 56%; }
    .seoul-rule {
      position: absolute; top: 7.2%; left: var(--pad-x); right: var(--pad-x); height: 1px;
      background: repeating-linear-gradient(90deg, var(--line-cyan) 0 8px, transparent 8px 16px);
    }
    .seoul-coreonline {
      position: absolute; top: 8.4%; left: var(--pad-x); font-family: var(--font-mono);
      font-size: clamp(11px, 3vw, 14px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0;
    }
    .seoul-dominant {
      font-family: var(--font-mono); font-weight: 500; font-size: clamp(26px, 8vw, 52px);
      letter-spacing: 0.02em; color: var(--text-hi); margin: 0;
    }
    .seoul-query {
      font-family: var(--font-mono); font-size: clamp(12px, 3.4vw, 16px); color: var(--text-low);
      letter-spacing: 0.04em; margin: 0; opacity: 0.8;
    }
    .seoul-status {
      font-family: var(--font-mono); font-size: clamp(13px, 3.6vw, 17px); color: #C9F6F7; letter-spacing: 0.04em; margin: 0;
    }
    /* Консольные пары ключ/значение (REPAIR/SETTINGS). */
    .seoul-kv {
      display: flex; align-items: baseline; gap: 12px; font-family: var(--font-mono);
      font-size: clamp(13px, 3.6vw, 17px); letter-spacing: 0.04em; color: var(--text-mid);
      padding: clamp(7px, 1.4vh, 11px) 0; border-bottom: 1px solid var(--line-dim); margin: 0;
    }
    .seoul-kv__k { color: var(--text-low); min-width: 11ch; }
    .seoul-kv__v { color: var(--text-hi); }
    .seoul-kv__v--warnword { color: var(--warn); letter-spacing: 0.12em; }
    .seoul-kv--sub { border-bottom: 0; color: var(--text-low); font-size: clamp(11px, 3vw, 14px); padding-top: 2px; }
    .seoul-kv--sub.is-disabled .seoul-kv__v { color: var(--text-low); }
    .seoul-kv--toggle { align-items: center; }
    .seoul-kv--toggle.is-off .seoul-kv__k { color: var(--text-low); text-decoration: line-through; opacity: 0.7; }

    /* Кнопки (тач-таргеты) — pointer-events:auto (plan-review Codex #3). */
    .seoul-cta, .seoul-btn, .seoul-toggle, .seoul-apply { pointer-events: auto; cursor: pointer; font-family: var(--font-mono); }
    .seoul-cta {
      appearance: none; background: linear-gradient(180deg, rgba(88,221,227,0.10), rgba(88,221,227,0.04));
      border: 1px solid var(--line-cyan-hi); color: var(--accent); border-radius: 4px;
      font-size: clamp(14px, 4vw, 18px); letter-spacing: 0.12em; padding: clamp(12px, 2vh, 16px) clamp(26px, 8vw, 44px);
      text-transform: none;
    }
    /* IDLE — первичная кнопка с присутствием (фидбэк оператора 2026-06-24: «поднять
       выше + выделить»). ТОЛЬКО IDLE (на вердиктах .seoul-cta остаётся сдержанной —
       Codex: не толстить глобально). Циан, без нового цвета — канон. */
    .seoul-cta--primary {
      background: linear-gradient(180deg, rgba(88,221,227,0.22), rgba(88,221,227,0.09));
      border-color: var(--accent); color: #EAFEFF; font-weight: 500;
      box-shadow: 0 0 24px var(--accent-glow), inset 0 0 0 1px rgba(88, 221, 227, 0.18);
      padding: clamp(14px, 2.4vh, 18px) clamp(34px, 12vw, 56px); letter-spacing: 0.16em;
    }
    .seoul-btn {
      appearance: none; background: linear-gradient(180deg, rgba(8,11,16,0.8), rgba(8,11,16,0.9));
      border: 1px solid var(--line-cyan); border-left: 2px solid var(--line-cyan-hi); color: var(--accent);
      border-radius: 2px; font-size: clamp(12px, 3.4vw, 15px); letter-spacing: 0.1em;
      padding: clamp(10px, 1.8vh, 14px) clamp(16px, 5vw, 26px); text-align: left;
    }
    .seoul-btnrow { display: flex; align-items: center; gap: 12px; margin-top: clamp(10px, 2vh, 16px); }
    .seoul-btn__status { font-family: var(--font-mono); font-size: clamp(11px, 3vw, 14px); color: var(--ok); letter-spacing: 0.08em; }
    .seoul-btn.is-ok { border-left-color: var(--ok); color: var(--ok); }

    /* Тумблер explainability — главный жест (кадр 9). Циан, без красного. */
    .seoul-toggle { display: inline-flex; align-items: center; gap: 12px; background: none; border: 0; padding: 6px 0; }
    .seoul-toggle__track {
      position: relative; width: clamp(54px, 16vw, 76px); height: clamp(24px, 7vw, 32px); border-radius: 999px;
      border: 1px solid var(--line-cyan-hi); background: rgba(88,221,227,0.10); transition: background 200ms ease;
    }
    .seoul-toggle__knob {
      position: absolute; top: 50%; left: 3px; transform: translateY(-50%);
      width: clamp(18px, 5.4vw, 24px); height: clamp(18px, 5.4vw, 24px); border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); transition: left 200ms cubic-bezier(0.16,1,0.3,1);
    }
    .seoul-toggle.is-off .seoul-toggle__track { background: rgba(88,221,227,0.04); border-color: var(--line-cyan); }
    .seoul-toggle.is-off .seoul-toggle__knob { left: calc(100% - clamp(18px, 5.4vw, 24px) - 3px); background: var(--accent-deep); box-shadow: none; }
    .seoul-toggle__state { font-family: var(--font-mono); font-size: clamp(12px, 3.4vw, 15px); letter-spacing: 0.16em; color: var(--accent); }
    .seoul-toggle.is-off .seoul-toggle__state { color: var(--text-low); }

    .seoul-apply { transition: opacity 200ms ease; }
    .seoul-apply.is-disabled { opacity: 0.4; cursor: default; }
    .seoul-apply__hint { font-family: var(--font-mono); font-size: clamp(10px, 2.8vw, 12px); color: var(--text-low); margin: 0; opacity: 0.7; }
    .seoul-apply__hint.is-hidden { display: none; }

    /* FINAL: красного вдох-затвора больше НЕТ (C2-D11) — кат в чёрный делается на лице
       (кадр 14, script.md), не на экране. Экран FINAL — холодный журнал прибытия, холд. */

    /* Режим чистого кадра (?fit=shoot): убрать любой нескадровый хром (его и так
       немного — HUD остаётся, это часть «дорогого» экрана). */
    html[data-fit="shoot"] #stage { background: var(--bg-900); }

    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; clip: rect(0 0 0 0); clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) {
      .seoul-scene { animation: none; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <!-- Layer-0 фон-видео Higgsfield (фидбэк оператора 2026-06-24): два ping-pong <video>
       ПОД #viz. Без src до рантайма — seoul/visuals.js→background.js ставит fetch→blob по
       состоянию + кроссфейдит. muted/loop/playsinline — автоплей разрешён (экран нем). -->
  <video id="video-layer-0a" muted loop playsinline preload="auto" aria-hidden="true"></video>
  <video id="video-layer-0b" muted loop playsinline preload="auto" aria-hidden="true"></video>

  <!-- Canvas визуала (свой B1-оркестратор; cyan-слои поверх Layer-0 видео). -->
  <canvas id="viz" aria-hidden="true"></canvas>

  <!-- Сцена (тело состояния) — монтирует seoul/scenes. -->
  <main id="scene"></main>

  <!-- Постоянная HUD-кромка — монтирует seoul/hud.js. -->
  <div id="seoul-hud" aria-hidden="true"></div>

  <!-- Сентинел self-test (smoke.sh грепает в --dump-dom). -->
  <div id="__selftest" class="visually-hidden" data-status="PENDING"></div>

  <script type="module" src="./src/seoul/main.js"></script>

  <!-- Регистрация офлайн service worker (S-D14): пропускаем в ?selftest (кэш не
       должен мешать детерминизму тестов). На http (кроме localhost) register молча
       не сработает — экран всё равно работает, просто без офлайн-кэша; на https
       (GitHub Pages) → после первой загрузки приложение готово к работе без сети. -->
  <script>
    if ('serviceWorker' in navigator && !new URLSearchParams(location.search).has('selftest')) {
      // controllerchange → новый SW взял управление (обновление). Перезагружаем на
      // свежие ассеты ОДИН раз. Пропускаем ПЕРВУЮ установку (контроллера не было —
      // страница и так с сети). Чинит «iOS PWA залип на старой версии».
      var hadController = !!navigator.serviceWorker.controller;
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing || !hadController) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Дёрнуть проверку обновления при каждом запуске (важно для iOS home-screen PWA).
          if (reg && typeof reg.update === 'function') { try { reg.update(); } catch (e) {} }
        }).catch(function () { /* нет https — без офлайна */ });
      });
    }
  </script>
</body>
</html>
